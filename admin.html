<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Security Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-8" onload="loadAlerts()">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-red-500 mb-6 flex items-center">
            <span class="mr-2">🚨</span> Live SOS Alerts
        </h1>
        <div class="bg-slate-800 rounded-lg overflow-hidden shadow-xl">
            <div class="flex justify-end mb-4">
                <button onclick="clearDatabase()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition shadow-lg flex items-center gap-2 text-sm">
                    🗑️ Clear All Alerts
                </button>
            </div>
            <table class="w-full text-left">
                <thead class="bg-slate-700 text-slate-300">
        <tr>
            <th class="p-4 text-left">Name</th>
            <th class="p-4 text-left">Location</th>
            <th class="p-4 text-left">Verification Proof</th> <th class="p-4 text-left">Time Received</th>
        </tr>
    </thead>
                    </tr>
                </thead>
                <tbody id="alertTable" class="divide-y divide-slate-700">
                    </tbody>
            </table>
        </div>
    </div>

   <script>
    const tableBody = document.querySelector('tbody');

    async function loadAlerts() {
        try {
            
            const response = await fetch('https://disaster-api-af2w.onrender.com/api/all-alerts');            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const alerts = await response.json();
            tableBody.innerHTML = ""; 

            alerts.reverse().forEach(alert => {
                const lat = alert.latitude || 0;
                const lon = alert.longitude || 0;
                const mapsLink = `https://www.google.com/maps?q=$${lat},${lon}`;

                let mediaContent = `<span class="text-slate-500 italic text-xs">No media attached</span>`;
                
                if (alert.mediaUrl && alert.mediaUrl !== "No media uploaded") {
                    if (alert.mediaUrl.match(/\.(mp4|webm|mov|ogg)$/i) || alert.mediaUrl.includes("/video/")) {
                        mediaContent = `
                            <video src="${alert.mediaUrl}" controls class="w-32 h-20 object-cover rounded-md border border-slate-600 bg-black shadow-sm"></video>
                        `;
                    } else {
                        mediaContent = `
                            <a href="${alert.mediaUrl}" target="_blank">
                                <img src="${alert.mediaUrl}" alt="Disaster Proof" class="w-24 h-16 object-cover rounded-md border border-slate-600 shadow-sm hover:scale-105 transition-transform duration-200">
                            </a>
                        `;
                    }
                }

                const row = `
                    <tr class="hover:bg-slate-800 transition border-b border-slate-700">
                        <td class="p-4 font-bold text-blue-400">${alert.studentId || "Unknown"}</td>
                        <td class="p-4 text-emerald-400">
                            <a href="${mapsLink}" target="_blank" class="hover:underline flex items-center gap-2">
                                📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}
                            </a>
                        </td>
                        <td class="p-4">${mediaContent}</td>
                        <td class="p-4 text-slate-400 font-mono">${alert.time || "No Date"}</td>
                    </tr>
                `;
                
                tableBody.innerHTML += row;
            });
        } catch (error) {
            console.error("Failed to load alerts:", error);
            tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 font-bold">Error loading dashboard data. Check backend connection.</td></tr>`;
        }
    }
    loadAlerts();
</script>
</body>
</html>
